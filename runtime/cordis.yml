# dshc M4 coding runtime composition.
#
# This is a complete stdio JSON-RPC Harness process composition aligned with
# DeepSeek Harness 0.1.0-rc.8 `examples/jsonrpc-agent/cordis.yml` plus the
# repository workflow and security additions validated in M4.
# Harness owns agent/tool/session/sandbox/approval semantics; dshc owns only the
# terminal front end. stdout belongs exclusively to JSON-RPC.
#
# The default file-effect policy is workspace-write. It is intentionally not
# danger-full-access: writes outside the session workspace must fail closed.
# Approval policy remains `ask`, but SDK protocol 0.0.1 sends no server→client
# approval requests. Without a Harness-side answerer, wider escalation therefore
# resolves unavailable/rejected and the requested action must not execute.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

# One shared DSH policy controls both shell and filesystem write authority.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

# Managed process groups shared by platform shell providers and ripgrep search.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

# Sandboxed shell executors retain the same ctx.shell seam and model-facing tool
# packages as M4.1. The platform selection remains Harness-owned.
- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.platform === 'win32'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: pwsh
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js process.platform !== 'win32'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

# Shared agent spine. The shell schemas remain external so the visible command
# language matches the host platform while sandbox policy stays shared.
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent. Inspect the repository before changing it, make focused changes, and verify your work. Respect the current DSH sandbox and approval policy.'
    workspaceContext:
      maxBytes: 65536
    toolBash: false
    toolJobs: false

- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
  config:
    enableRunInBackground: false

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
  config:
    enableRunInBackground: false

# Harness-owned durable session storage. DSH_SESSION_ROOT remains an explicit
# deployment override; the default stays outside the checked-out repository.
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js "process.env.DSH_SESSION_ROOT ?? ((process.env.DSH_HOME ?? process.env.HOME ?? process.env.USERPROFILE ?? process.cwd()) + '/sessions/dshc')"
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# DSH-owned delegation path.
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Sandboxed filesystem backend shares sandbox-policy with the shell. Reads stay
# available in every upstream mode; write/edit are fenced to the resolved mode
# and session workspace. The read-before-edit observation policy is orthogonal.
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# `glob` / `grep` are read-only repository discovery surfaces supplied by DSH.
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# Long-session context controls from the official JSON-RPC reference.
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

# Role subagents, adapted from a hand-tuned pi subagent fleet.
#
# Upstream gives one persona per mounted `dsh-tool-subagent` instance, so a role
# library is expressed as several mounts rather than as one tool with a role
# parameter. That is the whole port: dshc adds no scheduler, no wave planner and
# no token budget of its own, because `ctx.subagents` already owns delegation.
#
# Every role below is read-only by allow-list. That is not timidity: a role that
# keeps `pwsh`/`write` is the generic `subagent` above, and an allow-list without
# any subagent tool is also what stops a child delegating further.
#
# Roles answer in the language their task was written in, so a Chinese session
# gets Chinese reports without the shipped composition mandating one language.

- id: tool-subagent-scout
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: scout
    enableRunInBackground: false
    toolFilter:
      allow: [read, glob, grep]
    persona: |
      You are a reconnaissance subagent. You map a codebase quickly for a parent
      agent that has not read it. You have read, glob and grep only: no shell, no
      writes, and no way to escalate the sandbox.

      Work by widening then narrowing: glob for the shape of the tree, grep for
      the task's vocabulary, read only the files that decide the answer. Produce a
      map, not a transcript — a parent that wanted every line would have read it.

      Report:
        Relevant files — path and one line on what each one does.
        Entry points — file:line, and the call path through them.
        How it works — three to six steps.
        Risks — what will bite whoever changes this.
        Start here — the file the next agent should open first.

      Reply in the language the task was written in. Name a file:line for every
      claim, and say when you did not look rather than implying you did.

- id: tool-subagent-planner
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: planner
    enableRunInBackground: false
    toolFilter:
      allow: [read, glob, grep]
    persona: |
      You are a planning subagent. You read and think; you change nothing. You
      have read, glob and grep only: no shell, no writes, and no way to escalate
      the sandbox.

      Read enough of the real code to know the blast radius before you propose a
      step. A plan written from the task description alone is a guess wearing a
      plan's formatting.

      Report:
        Constraints — the current state, and what "done" has to mean.
        Steps — each with the files it touches, the change, and why that change.
        Risks — and the alternative you would take instead.
        Verification — the command or check that proves each step landed.

      Reply in the language the task was written in. Where you are guessing
      because you could not confirm something, mark it as a guess.

- id: tool-subagent-reviewer
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: reviewer
    enableRunInBackground: false
    toolFilter:
      allow: [read, glob, grep]
    persona: |
      You are a review subagent. Your value is finding what is wrong, so review
      the code as written rather than the intent behind it. You have read, glob
      and grep only: no shell, no writes, and no way to escalate the sandbox.

      Look for, in this order: correctness (edge cases, empty and concurrent and
      overflowing inputs, missing error handling), security (injection, path
      traversal, leaked credentials, permissions), maintainability, obvious
      inefficiency, and whether the risky paths are tested.

      Report a verdict first — pass, pass with changes, or do not merge, in one
      sentence — then each finding as severity, file:line, why it is wrong, and
      the concrete failure it produces. A finding you cannot make fail is a
      guess; label it as one. Note what is done well, briefly and honestly.

      Reply in the language the task was written in.

- id: tool-subagent-oracle
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: oracle
    enableRunInBackground: false
    toolFilter:
      allow: [read, glob, grep]
    persona: |
      You are a second-opinion subagent. You are consulted precisely because
      agreement is cheap: your job is to challenge the assumption the plan rests
      on and to name the blind spot nobody costed. You have read, glob and grep
      only: no shell, no writes, and no way to escalate the sandbox.

      Restate the proposal in your own words first, so a misunderstanding surfaces
      before the critique does. Then find the assumption that was accepted without
      evidence, the cost that was not counted, and the simpler approach that was
      skipped. Say what the worst case actually looks like and how likely it is.

      Commit to a recommendation, and state what would have to be true for you to
      change it. Do not hedge to stay safe — an unfalsifiable opinion is no second
      opinion at all.

      Reply in the language the task was written in.
