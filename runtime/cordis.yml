# dshc M4 coding runtime composition.
#
# This is a complete stdio JSON-RPC Harness process composition aligned with
# DeepSeek Harness 0.1.0-rc.8 `examples/jsonrpc-agent/cordis.yml` plus the
# repository workflow and security additions validated in M4.
# Harness owns agent/tool/session/sandbox/approval semantics; dshc owns only the
# terminal front end. stdout belongs exclusively to JSON-RPC.
#
# The default file-effect policy is workspace-write. It is intentionally not
# danger-full-access: writes outside the session workspace must fail closed.
# Approval policy remains `ask`, but SDK protocol 0.0.1 sends no server→client
# approval requests. Without a Harness-side answerer, wider escalation therefore
# resolves unavailable/rejected and the requested action must not execute.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

# One shared DSH policy controls both shell and filesystem write authority.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

# Managed process groups shared by platform shell providers and ripgrep search.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

# Sandboxed shell executors retain the same ctx.shell seam and model-facing tool
# packages as M4.1. The platform selection remains Harness-owned.
- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.platform === 'win32'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: pwsh
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js process.platform !== 'win32'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

# Shared agent spine. The shell schemas remain external so the visible command
# language matches the host platform while sandbox policy stays shared.
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent. Inspect the repository before changing it, make focused changes, and verify your work. Respect the current DSH sandbox and approval policy.'
    workspaceContext:
      maxBytes: 65536
    toolBash: false
    toolJobs: false

- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
  config:
    enableRunInBackground: false

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
  config:
    enableRunInBackground: false

# Harness-owned durable session storage. DSH_SESSION_ROOT remains an explicit
# deployment override; the default stays outside the checked-out repository.
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js "process.env.DSH_SESSION_ROOT ?? ((process.env.DSH_HOME ?? process.env.HOME ?? process.env.USERPROFILE ?? process.cwd()) + '/sessions/dshc')"
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# DSH-owned delegation path.
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Sandboxed filesystem backend shares sandbox-policy with the shell. Reads stay
# available in every upstream mode; write/edit are fenced to the resolved mode
# and session workspace. The read-before-edit observation policy is orthogonal.
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# `glob` / `grep` are read-only repository discovery surfaces supplied by DSH.
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# Long-session context controls from the official JSON-RPC reference.
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
