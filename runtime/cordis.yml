# dshc M4 coding runtime composition.
#
# This is a complete stdio JSON-RPC Harness process composition aligned with
# DeepSeek Harness 0.1.0-rc.8 `examples/jsonrpc-agent/cordis.yml` plus the
# zero-config repository additions validated in M4.1.
# Harness owns agent/tool/session semantics; dshc owns only the terminal front end.
# stdout belongs exclusively to JSON-RPC: do not add console loggers or UI plugins.
#
# Deliberate compatibility delta from the upstream standalone reference:
# the reference mounts POSIX-only dsh-bash-local unconditionally. dshc keeps
# Windows blocking, so the shell provider + model-facing shell tool follow the
# upstream base/profile platform rule: Bash on POSIX, PowerShell on Windows.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

# Managed process groups shared by platform shell providers and ripgrep search.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  disabled: !!js process.platform === 'win32'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: pwsh
  name: '@deepseek-ai/dsh-pwsh-local'
  disabled: !!js process.platform !== 'win32'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

# Shared agent spine. M4.1 enables the same bounded workspace-context budget
# used by the pinned upstream coding/headless compositions. Shell schemas remain
# external so the visible command language can match the host platform.
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent. Inspect the repository before changing it, make focused changes, and verify your work.'
    workspaceContext:
      maxBytes: 65536
    toolBash: false
    toolJobs: false

# tool-bash/tool-pwsh both require the shared trusted DSH_* environment registry.
# The spine would normally own this together with its built-in bash tool, but
# toolBash=false deliberately moves both shell consumers to the leaf composition.
- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
  config:
    enableRunInBackground: false

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
  config:
    enableRunInBackground: false

# Harness-owned durable session storage. DSH_SESSION_ROOT remains an explicit
# deployment override; the default stays outside the checked-out repository.
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js "process.env.DSH_SESSION_ROOT ?? ((process.env.DSH_HOME ?? process.env.HOME ?? process.env.USERPROFILE ?? process.cwd()) + '/sessions/dshc')"
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# DSH-owned delegation path.
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Repository filesystem capabilities. The observation policy keeps read-before-
# overwrite/edit semantics inside Harness rather than implementing them in dshc.
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# `glob` / `grep` are provided by the pinned DSH search plugin and its packaged
# ripgrep binary. It uses the same DSH_CWD-backed workdir as fs-local so search
# results are directly follow-up-readable with the filesystem tools.
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# Long-session context controls from the official JSON-RPC reference.
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
