# M1 runtime composition for dshc.
#
# This deliberately keeps the agent surface small while proving the official
# stdio JSON-RPC boundary. stdout belongs exclusively to JSON-RPC: do not add
# console loggers or terminal UI plugins here.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: true

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a helpful software engineering assistant.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false
