<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Representative DeepSeek Harness Console public alpha terminal</title>
  <desc id="desc">A dark terminal frame showing dshc version, repository context, Harness tool activity, tests and a successful summary.</desc>
  <rect width="1200" height="680" rx="24" fill="#0b1020"/>
  <rect x="1" y="1" width="1198" height="678" rx="23" fill="none" stroke="#26324f" stroke-width="2"/>
  <circle cx="38" cy="34" r="7" fill="#ff6b6b"/>
  <circle cx="62" cy="34" r="7" fill="#ffd166"/>
  <circle cx="86" cy="34" r="7" fill="#57d38c"/>
  <text x="600" y="41" fill="#8796b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" text-anchor="middle">dshc · public alpha</text>
  <line x1="0" y1="62" x2="1200" y2="62" stroke="#26324f"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">
    <text x="34" y="102" fill="#73e0c1">DeepSeek Harness Console 0.1.0-alpha.5</text>
    <text x="34" y="136" fill="#8796b8">workspace</text><text x="160" y="136" fill="#d8e1f3">sample-repository</text>
    <text x="510" y="136" fill="#8796b8">provider</text><text x="620" y="136" fill="#d8e1f3">deepseek-official</text>
    <text x="34" y="180" fill="#b8c4dc">› Inspect the repository, fix the smallest reproducible defect, and run its tests.</text>

    <rect x="34" y="212" width="1132" height="78" rx="10" fill="#111a30" stroke="#334467"/>
    <text x="54" y="244" fill="#78a9ff">grep</text><text x="120" y="244" fill="#8796b8">Harness tool · completed</text>
    <text x="54" y="272" fill="#d8e1f3">Located the failing boundary check and its focused test.</text>

    <rect x="34" y="306" width="1132" height="78" rx="10" fill="#111a30" stroke="#334467"/>
    <text x="54" y="338" fill="#f6c177">edit</text><text x="120" y="338" fill="#8796b8">workspace-write · completed</text>
    <text x="54" y="366" fill="#d8e1f3">Updated one repository-local source file.</text>

    <rect x="34" y="400" width="1132" height="78" rx="10" fill="#111a30" stroke="#334467"/>
    <text x="54" y="432" fill="#c4a7e7">shell</text><text x="130" y="432" fill="#8796b8">Harness tool · exit 0</text>
    <text x="54" y="460" fill="#57d38c">Test Files  1 passed · Tests  6 passed</text>

    <text x="34" y="520" fill="#73e0c1">assistant</text>
    <text x="34" y="552" fill="#d8e1f3">Fixed the boundary check and ran the focused suite successfully.</text>
    <text x="34" y="584" fill="#8796b8">Changed: src/example.ts · Validation: 6 tests passed</text>

    <rect x="22" y="618" width="1156" height="42" rx="8" fill="#0f172a"/>
    <text x="38" y="645" fill="#8796b8">workspace-write · protocol 0.0.1 · dsh 0.1.1-rc.2</text>
    <text x="1160" y="645" fill="#57d38c" text-anchor="end">idle</text>
  </g>
</svg>
