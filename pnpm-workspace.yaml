# pnpm 11 defaults to a 24-hour minimum release age. The project pins the
# just-released DeepSeek Harness developer-preview closure to 0.1.1-rc.2, so
# only the upstream DeepSeek scope is exempted. All other dependencies retain
# pnpm's default supply-chain maturity check.
autoInstallPeers: true
strictPeerDependencies: false
saveExact: true
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'

# pnpm 11 rejects unreviewed dependency build scripts by default. Keep this a
# deny-by-default allowlist and mirror the reviewed scripts required by the
# pinned DeepSeek Harness runtime closure:
# - esbuild: TypeScript/Vitest native bootstrap;
# - node-pty: cross-platform PTY backend (including ConPTY);
# - koffi: Windows JSONL durability bindings;
# - dsh-subprocess-local: restores the packaged node-pty helper executable bit.
# Do not broaden this list without an upstream/runtime review.
allowBuilds:
  esbuild: true
  node-pty: true
  koffi: true
  '@deepseek-ai/dsh-subprocess-local': true
