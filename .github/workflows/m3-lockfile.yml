name: M3 lockfile

on:
  push:
    branches: [feat/m3-terminal-product-layer]
    paths:
      - package.json
      - .github/workflows/m3-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m3-terminal-product-layer
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --lockfile-only --no-frozen-lockfile
      - run: |
          if git diff --quiet -- pnpm-lock.yaml; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git commit -m "build: refresh lockfile for Ink terminal shell"
          git push origin HEAD:feat/m3-terminal-product-layer
