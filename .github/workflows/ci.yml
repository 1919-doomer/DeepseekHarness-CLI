name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality / Node 24 / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
      - name: Enable pnpm 11.7.0
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers
      - run: pnpm audit:prod
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack:check

  runtime:
    name: Runtime / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '24.x'
          - os: windows-latest
            node: '24.x'
          - os: macos-latest
            node: '24.x'
          - os: ubuntu-latest
            node: '22.19.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Enable pnpm 11.7.0
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build terminal product
        run: pnpm build
      - name: Fake-runtime protocol and lifecycle tests
        run: pnpm test
      - name: Official DSH runtime + built CLI smoke
        run: pnpm test:official-runtime
        env:
          DSHC_LIVE_PLUGIN_INSTALL: '1'
      - name: Packed global install / repair / doctor / uninstall
        run: pnpm test:package
