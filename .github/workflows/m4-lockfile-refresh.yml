name: M4.3 sandbox lockfile refresh
on:
  push:
    branches: [m4/workspace-sandbox-default]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4/workspace-sandbox-default
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-lock.yaml
          git commit -m 'chore: refresh lockfile for M4.3 sandbox (#66)'
          git push origin HEAD:m4/workspace-sandbox-default
