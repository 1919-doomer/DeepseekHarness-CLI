name: Stage public alpha

on:
  push:
    tags:
      - 'v0.1.0-alpha.*'

permissions:
  contents: read

jobs:
  package:
    name: Build verified tarball
    runs-on: ubuntu-latest
    outputs:
      package-exists: ${{ steps.registry.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Enable pnpm 11.7.0
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:prod
      - run: pnpm check
      - run: pnpm test:official-runtime
      - name: Verify tag and release identity
        run: pnpm release:verify -- "${GITHUB_REF_NAME}"
      - name: Create the release tarball and checksum
        run: |
          mkdir package-artifact
          npm pack --pack-destination package-artifact
          sha256sum package-artifact/*.tgz > package-artifact/SHA256SUMS
      - name: Detect first-publication bootstrap
        id: registry
        run: |
          if npm view dshc name --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: package-artifact
          if-no-files-found: error
          retention-days: 14

  installed-package:
    name: Installed package / ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '24.x'
          - os: windows-latest
            node: '24.x'
          - os: macos-latest
            node: '24.x'
          - os: ubuntu-latest
            node: '22.19.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package-artifact
      - run: node scripts/package-smoke.mjs package-artifact

  stage-npm:
    name: Stage npm package for 2FA approval
    needs:
      - package
      - installed-package
    if: needs.package.outputs.package-exists == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package-artifact
      - run: npm install --global npm@11.19.0
      - name: Stage the exact tested tarball
        run: npm stage publish package-artifact/*.tgz --access public --tag alpha --provenance

  draft-release:
    name: Create draft GitHub prerelease
    needs:
      - package
      - installed-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package-artifact
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          package-artifact/*.tgz package-artifact/SHA256SUMS
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --draft
          --prerelease
          --title "dshc ${GITHUB_REF_NAME#v}"
