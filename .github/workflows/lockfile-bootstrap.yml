name: Bootstrap lockfile

on:
  push:
    branches:
      - feat/m1-runtime-vertical-slice
    paths:
      - package.json
      - .npmrc
      - .github/workflows/lockfile-bootstrap.yml
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - .npmrc
      - .github/workflows/lockfile-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Enable pnpm 11.7.0
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - name: Generate lockfile
        run: pnpm install --lockfile-only
      - uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
