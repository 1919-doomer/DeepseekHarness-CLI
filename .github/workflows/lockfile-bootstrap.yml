name: Bootstrap lockfile

on:
  push:
    branches:
      - feat/m1-runtime-vertical-slice
    paths:
      - package.json
      - .npmrc
      - .github/workflows/lockfile-bootstrap.yml
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - .npmrc
      - .github/workflows/lockfile-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Enable pnpm 11.7.0
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - name: Generate lockfile
        run: pnpm install --lockfile-only
      - uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
      - name: Commit lockfile on branch push
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "chore: lock M1 dependencies"
            git push
          fi
