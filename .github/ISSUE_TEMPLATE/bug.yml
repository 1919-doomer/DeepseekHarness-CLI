name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug] "
labels: []
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest reproducible sequence. Remove secrets and private repository content.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Windows 11 / Ubuntu / macOS
    validations:
      required: true
  - type: input
    id: dshc
    attributes:
      label: dshc version or commit
  - type: input
    id: harness
    attributes:
      label: DeepSeek Harness / SDK version
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
