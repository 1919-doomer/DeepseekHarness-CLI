name: Feature request
description: Propose a scoped product or engineering change
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: upstream
    attributes:
      label: Upstream dependency
      description: Which DeepSeek Harness public contract, if any, does this rely on?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true before this issue can close?
    validations:
      required: true
